{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block page_title %}注册{% endblock %}
{% block content %}
<div style="max-width:500px;margin:40px auto;">
    <div class="card">
        <div class="card-header">
            <h2>📝 注册</h2>
            <span class="subtitle">注册后可在后台管理教材与交易</span>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="请输入姓名">
                </div>
                <div class="form-group">
                    <label for="contact">联系方式</label>
                    <input type="text" id="contact" name="contact" class="form-control" required placeholder="手机号或电话">
                </div>
                <div class="form-group">
                    <label for="email">邮箱（用于登录）</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="请设置密码">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">注册并登录</button>
            </form>
            <div style="text-align:center;margin-top:16px;">
                <a href="/auth/login" style="color:var(--primary);font-size:13px;text-decoration:none;">已有账号？去登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
