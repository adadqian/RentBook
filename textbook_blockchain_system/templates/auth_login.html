{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block page_title %}登录{% endblock %}
{% block content %}
<div style="max-width:420px;margin:40px auto;">
    <div class="card">
        <div class="card-header">
            <h2>🔑 登录</h2>
            <span class="subtitle">使用注册邮箱登录</span>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">登录</button>
            </form>
            <div style="text-align:center;margin-top:16px;">
                <a href="/auth/register" style="color:var(--primary);font-size:13px;text-decoration:none;">没有账号？去注册</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
