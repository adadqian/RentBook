{% extends "base.html" %}
{% block title %}发起交易{% endblock %}
{% block page_title %}发起交易{% endblock %}
{% block content %}
<div style="max-width:560px;">
    <div class="card">
        <div class="card-header">
            <h2>🤝 发起交易</h2>
            <span class="subtitle">提交购买请求，当前登录用户将作为买家</span>
        </div>
        <div class="card-body">
            <div class="alert alert-info">
                💡 请确保您已经知道要购买的教材ID，该ID在教材注册成功后会显示。
            </div>

            <form method="POST">
                <div class="form-group">
                    <label for="textbook_id">教材ID</label>
                    <input type="text" id="textbook_id" name="textbook_id" class="form-control" required placeholder="请输入教材ID">
                </div>
                <div class="form-group">
                    <label for="offer_price">报价 (元)</label>
                    <input type="number" id="offer_price" name="offer_price" class="form-control" step="0.01" required placeholder="例如：45.00">
                </div>
                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary">🤝 发起交易</button>
                    <a href="/" class="btn btn-secondary">返回首页</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
