{% extends "base.html" %}
{% block title %}错误{% endblock %}
{% block page_title %}发生错误{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 480px; margin: 40px auto;">
    <div style="font-size: 64px; margin-bottom: 16px;">❌</div>
    <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">出错了</h2>
    <div class="alert alert-danger" style="text-align: left;">
        <strong>错误信息：</strong>{{ message }}
    </div>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">
        HTTP 状态码：<span class="mono">{{ status_code }}</span>
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">🏠 返回首页</a>
</div>
{% endblock %}
