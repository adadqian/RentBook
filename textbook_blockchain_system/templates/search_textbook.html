{% extends "base.html" %}
{% block title %}教材查询{% endblock %}
{% block page_title %}教材查询{% endblock %}
{% block content %}
<div style="max-width:560px;">
    <div class="card">
        <div class="card-header">
            <h2>🔍 教材查询</h2>
            <span class="subtitle">输入教材ID，查询相关交易记录和区块信息</span>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="textbook_id">教材ID</label>
                    <input type="text" id="textbook_id" name="textbook_id" class="form-control" required placeholder="请输入教材ID">
                </div>
                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary">🔍 查询</button>
                    <a href="/" class="btn btn-secondary">返回首页</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
