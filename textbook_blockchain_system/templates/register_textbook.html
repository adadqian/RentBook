{% extends "base.html" %}
{% block title %}教材注册{% endblock %}
{% block page_title %}教材注册{% endblock %}
{% block content %}
<div style="max-width:720px;">
    <div class="card">
        <div class="card-header">
            <h2>📖 教材信息注册</h2>
            <span class="subtitle">将教材信息上链，当前登录用户将作为卖家</span>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-section">📚 教材基本信息</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" class="form-control" required placeholder="例如：9787111640605">
                    </div>
                    <div class="form-group">
                        <label for="version">版本</label>
                        <input type="text" id="version" name="version" class="form-control" required placeholder="例如：第3版">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="condition">品相</label>
                        <select id="condition" name="condition" class="form-control" required>
                            <option value="">请选择品相</option>
                            <option value="全新">全新</option>
                            <option value="九成新">九成新</option>
                            <option value="八成新">八成新</option>
                            <option value="七成新">七成新</option>
                            <option value="六成新">六成新</option>
                            <option value="五成新">五成新</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="initial_price">初始定价 (元)</label>
                        <input type="number" id="initial_price" name="initial_price" class="form-control" step="0.01" required placeholder="例如：50.00">
                    </div>
                </div>

                <div class="form-section">📎 教材辅助信息</div>
                <div class="form-group">
                    <label for="photos">照片上传</label>
                    <input type="file" id="photos" name="photos" class="form-control" multiple accept="image/*">
                    <span class="hint">提示：可选择多个图片文件</span>
                </div>
                <div class="form-group">
                    <label for="description">描述</label>
                    <textarea id="description" name="description" class="form-control" rows="3" placeholder="教材详细描述，如使用情况、外观等"></textarea>
                </div>
                <div class="form-group">
                    <label for="location">位置</label>
                    <input type="text" id="location" name="location" class="form-control" placeholder="例如：图书馆三楼">
                </div>

                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary">📤 提交注册</button>
                    <a href="/" class="btn btn-secondary">返回首页</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
