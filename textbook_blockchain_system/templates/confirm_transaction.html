{% extends "base.html" %}
{% block title %}确认交易{% endblock %}
{% block page_title %}确认交易{% endblock %}
{% block content %}
<div style="max-width:560px;">
    <div class="card">
        <div class="card-header">
            <h2>✅ 确认交易</h2>
            <span class="subtitle">输入教材ID与交易ID确认交易完成</span>
        </div>
        <div class="card-body">
            <div class="alert alert-warning">
                ⚠️ 请在核实买家付款后再确认交易，确认后交易状态将更新为"完成"。建议直接去"我的后台"一键确认。
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label for="textbook_id">教材ID</label>
                    <input type="text" id="textbook_id" name="textbook_id" class="form-control" required placeholder="请输入教材ID">
                </div>
                <div class="form-group">
                    <label for="transaction_id">交易ID</label>
                    <input type="text" id="transaction_id" name="transaction_id" class="form-control" required placeholder="请输入交易ID">
                    <span class="hint">请输入要确认的交易ID，可从交易详情页面复制</span>
                </div>
                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-success">✅ 确认交易</button>
                    <a href="/" class="btn btn-secondary">返回首页</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
